name: Pack Sync

# Runs when a PR touching rules/sigma/** (typically a sigma-sync/* PR) is
# approved -- i.e. before it's merged to master. Finds which packs would
# drift once those rule changes land, and stages that drift as per-pack PRs
# against packs-dev instead of master, so sigma-driven changes go through
# the same packs-dev -> pack-pr -> master -> pack-release staging path as
# manually-edited packs, rather than going straight to production.

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number (touching rules/sigma/**) to sync from, for manual re-runs"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    if: github.event_name == 'workflow_dispatch' || github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    outputs:
      packs: ${{ steps.discover.outputs.packs }}
      pr_number: ${{ steps.discover.outputs.pr_number }}
      head_sha: ${{ steps.discover.outputs.head_sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve PR
        id: resolve
        run: |
          NUMBER="${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}"
          PR_JSON=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json number,headRefOid,baseRefOid,baseRefName)

          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.headRefOid' <<< "$PR_JSON")" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(jq -r '.baseRefOid' <<< "$PR_JSON")" >> "$GITHUB_OUTPUT"
          echo "relevant=$([ "$(jq -r '.baseRefName' <<< "$PR_JSON")" = "master" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.resolve.outputs.relevant == 'true'
        with:
          ref: ${{ steps.resolve.outputs.head_sha }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        if: steps.resolve.outputs.relevant == 'true'

      - name: Install dependencies
        if: steps.resolve.outputs.relevant == 'true'
        run: uv sync

      - name: Discover affected packs
        id: discover
        run: |
          echo "pr_number=${{ steps.resolve.outputs.number }}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${{ steps.resolve.outputs.head_sha }}" >> "$GITHUB_OUTPUT"

          if [ "${{ steps.resolve.outputs.relevant }}" != "true" ]; then
            echo "PR #${{ steps.resolve.outputs.number }} does not target master; skipping."
            echo "packs=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "${{ steps.resolve.outputs.base_sha }}" "${{ steps.resolve.outputs.head_sha }}" -- rules/sigma/ | wc -l)
          if [ "$CHANGED" -eq 0 ]; then
            echo "PR #${{ steps.resolve.outputs.number }} does not touch rules/sigma/; skipping."
            echo "packs=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          uv run python tools/sync_packs.py --diff --json > "$RUNNER_TEMP/diff.json"
          PACKS_JSON=$(jq -c '[.[] | select(.drifted | length > 0) | {os: .os, pack: .pack}]' "$RUNNER_TEMP/diff.json")
          echo "packs=$PACKS_JSON" >> "$GITHUB_OUTPUT"

  sync:
    needs: discover
    if: needs.discover.outputs.packs != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.packs) }}
    concurrency:
      group: pack-sync-${{ matrix.os }}-${{ matrix.pack }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OS: ${{ matrix.os }}
      PACK: ${{ matrix.pack }}
      BRANCH: pack-sync/${{ matrix.os }}-${{ matrix.pack }}
      SIGMA_PR: ${{ needs.discover.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.discover.outputs.head_sha }}

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Diff pack against proposed sigma changes
        run: |
          uv run python tools/sync_packs.py --diff --json --os "$OS" --pack "$PACK" > "$RUNNER_TEMP/diff.json"
          cat "$RUNNER_TEMP/diff.json"

      - name: Build PR body
        run: |
          jq -r --arg pr "$SIGMA_PR" '
            .[0] as $d |
            "## Pack sync — \($d.os)/\($d.pack) (staged via packs-dev)\n\n" +
            "Sigma rule changes from PR #\($pr) affect this pack. Staged here for review before release.\n\n" +
            "### Changed rules (\($d.drifted | length))\n\n" +
            ([$d.drifted[] | "- `\(.id)` — `\(.pack_path)` — changed: \(.fields | join(", "))"] | join("\n")) + "\n\n" +
            (if ($d.orphaned | length) > 0 then
              "### ⚠️ Orphaned rules (\($d.orphaned | length)) -- not touched by this PR\n\n" +
              "These IDs are in this pack but no longer exist under `rules/sigma/\($d.os)/`. Review manually.\n\n" +
              ([$d.orphaned[] | "- `\(.id)` — `\(.pack_path)`"] | join("\n")) + "\n\n"
            else "" end) +
            "---\n*Automated staging PR, opened when PR #\($pr) (rules/sigma changes) was approved. Merging sends this into `packs-dev`; when `packs-dev` merges to `master`, the pack is rebuilt and uploaded to Radegast EDR.*"
          ' "$RUNNER_TEMP/diff.json" > "$RUNNER_TEMP/pr-body.md"

          cat "$RUNNER_TEMP/pr-body.md"

      - name: Stage updated rule files
        run: |
          mkdir -p "$RUNNER_TEMP/stage"
          jq -r '.[0].drifted[] | "\(.rules_path)\t\(.pack_path)"' "$RUNNER_TEMP/diff.json" |
          while IFS=$'\t' read -r rules_path pack_path; do
            mkdir -p "$RUNNER_TEMP/stage/$(dirname "$pack_path")"
            cp "$rules_path" "$RUNNER_TEMP/stage/$pack_path"
          done

      - name: Apply onto packs-dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin packs-dev
          git checkout -B "$BRANCH" FETCH_HEAD
          cp -r "$RUNNER_TEMP/stage/." .
          git add "packs/$OS/$PACK"
          git commit -m "chore(packs): stage $OS/$PACK sigma updates from PR #$SIGMA_PR"
          git push --force origin "$BRANCH"

      - name: Create or update PR
        run: |
          TITLE="chore(packs): stage $OS/$PACK sigma updates (from PR #$SIGMA_PR)"
          EXISTING=$(gh pr list --head "$BRANCH" --base packs-dev --state open --json number -q '.[0].number')

          if [ -z "$EXISTING" ]; then
            gh pr create \
              --title "$TITLE" \
              --body-file "$RUNNER_TEMP/pr-body.md" \
              --base packs-dev \
              --head "$BRANCH"
          else
            gh pr edit "$EXISTING" \
              --title "$TITLE" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi
