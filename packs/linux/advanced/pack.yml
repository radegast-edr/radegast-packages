name: Linux Advanced
id: linux-advanced
description: >
  Linux Essential plus broader production detections. More false positives may
  occur than in Essential (notably from package installs); tune per environment
  before relying on by default.
os: linux
level: advanced
pack_schema_version: 1
requires_rustinel: ">=1.0.2"
default: false
expected_false_positive_level: medium
status: experimental
license: DRL-1.1
extends:
- linux-essential
attack_coverage:
- T1543.002
- T1053.003
- T1546.004
- T1059.004
- T1036
- T1105
telemetry_requirements:
- file_event
- process_creation
- file_scan
test_status: none
sources:
  manual:
  - https://attack.mitre.org/
